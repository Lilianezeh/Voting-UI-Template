<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="./output.css" rel="stylesheet" />
  <title>AfricaPlan Foundation</title>
</head>

<body class="bg-emerald-50">

  <div class="max-w-5xl mx-auto p-6">

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold">
        HackathonAfrica 3.0 Voting System
      </h1>
      <br>
      <p class="text-gray-600">
        Head of House Election
      </p>

      <p class="mt-2 text-lg">
        Total Members: <span class="font-bold">20</span>
      </p>

      <p>
        Votes Cast:
        <span id="votesCast" class="font-bold text-blue-600">0</span>/20
      </p>
    </div>

    <div class="max-w-sm rounded-xl overflow-hidden shadow-lg bg-white p-6 border border-gray-100">
      <h3 class="text-lg font-semibold text-gray-800 mb-2">Select Your Name</h3>
      <p class="text-sm text-gray-500 mb-4">Choose a name from the list below.</p>

      <div class="relative">
        <select id="voterSelect"
          class="w-full bg-gray-50 border border-gray-300 text-gray-700 text-sm rounded-lg p-2.5">
          <option selected>Choose a name</option>
          <option value="Austin">Austin</option>
          <option value="Lilian">Lilian</option>
          <option value="Majesty">Majesty</option>
          <option value="Chidimma">Chidimma</option>
          <option value="Ifeanyi">Ifeanyi</option>
          <option value="Stephanie">Stephanie</option>
          <option value="Rita">Rita</option>
          <option value="Christopher">Christopher</option>
          <option value="Bonaventure">Bonaventure</option>
          <option value="Victor">Victor</option>
          <option value="Amarachi">Amarachi</option>
          <option value="Charles">Charles</option>
          <option value="Abigail">Abigail</option>
          <option value="Loveth">Loveth</option>
          <option value="James">James</option>
          <option value="David">David</option>
          <option value="Anthony">Anthony</option>
          <option value="Kosisochukwu">Kosisochukwu</option>
          <option value="Gabriel">Gabriel</option>
          <option value="Peter">Peter</option>
        </select>
      </div>
    </div>

    <br>
    <br>
    <div class="bg-white rounded-lg relative shadow px-6 py-12">

      <button id="voteBtn"
        class="rounded-md bg-blue-500 px-2.5 py-1.5 text-sm font-semibold absolute right-4 text-white inset-ring inset-ring-white/5 bottom-2 hover:bg-teal-400">
        Record Vote
      </button>
      <h2 class="text-xl text-center font-bold mb-4">
        Cast Your Vote
      </h2>

      <form class="max-w-sm mx-auto">
        <label for="candidateSelect" class="block mb-2.5 text-sm font-medium text-heading">Candidate</label>
        <select id="candidateSelect"
          class="block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body">
          <option selected>Select Candidate</option>
          <option value="Kosisochukwu">Kosisochukwu</option>
          <option value="Austin">Austin</option>
          <option value="Chidimma">Lilian</option>
          <option value="Ifeanyi">Ifeanyi</option>
          <option value="Rita">Victor</option>
          <option value="Bonaventure">Charles</option>
        </select>
      </form>

    </div>

    <div class="w-full px-4 py-4 bg-teal-600 text-white rounded">
      <h1 class="font-bold mb-2">Voter Count</h1>
      <div id="resultsContainer" class="flex flex-col items-end gap-1">
        <!-- candidate rows injected by main.ts -->
      </div>
      <h2 id="winner" class="text-xl font-bold text-white mt-4 text-right">
        No Winner Yet
      </h2>
    </div>

    <!-- Confirmation Dialog -->
    <dialog id="dialog" aria-labelledby="dialog-title"
      class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent m-auto p-0">

      <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div
          class="relative transform overflow-hidden rounded-lg bg-gray-800 text-left shadow-xl outline -outline-offset-1 outline-white/10 sm:my-8 sm:w-full sm:max-w-lg">
          <div class="bg-gray-800 px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
            <div class="sm:flex sm:items-start">
              <div
                class="mx-auto flex size-12 shrink-0 items-center justify-center rounded-full bg-red-500/10 sm:mx-0 sm:size-10">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon"
                  aria-hidden="true" class="size-6 text-red-400">
                  <path
                    d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"
                    stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </div>
              <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                <h3 id="dialog-title" class="text-base font-semibold text-white">Record My Vote</h3>
                <div class="mt-2">
                  <p class="text-sm text-gray-400">Are you sure you want to vote for the selected candidate?</p>
                </div>
              </div>
            </div>
          </div>
          <div class="bg-gray-700/25 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
            <button type="button" id="confirmVoteBtn"
              class="inline-flex w-full justify-center rounded-md bg-red-500 px-3 py-2 text-sm font-semibold text-white hover:bg-red-400 sm:ml-3 sm:w-auto">
              Vote
            </button>
            <button type="button" id="cancelVoteBtn"
              class="mt-3 inline-flex w-full justify-center rounded-md bg-white/10 px-3 py-2 text-sm font-semibold text-white inset-ring inset-ring-white/5 hover:bg-white/20 sm:mt-0 sm:w-auto">
              Cancel
            </button>
          </div>
        </div>
      </div>
    </dialog>

    <script type="module" src="../dist/main.js"></script>
  </div>

</body>

</html>
